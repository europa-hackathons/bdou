<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BDOU – Disco Sushi Train</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%232b2d42'/%3E%3Ccircle cx='50' cy='50' r='36' fill='%23fff'/%3E%3Ccircle cx='50' cy='50' r='22' fill='%23ff8a65'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff5fb0; --cyan:#2de2e6; --yellow:#ffe14d; --purple:#7b5cff; --ink:#2b1b4a; --white:#fff;
  --font:'Fredoka','Baloo 2','Chalkboard SE','Comic Sans MS','Arial Rounded MT Bold',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1a0b3a;overflow:hidden;font-family:var(--font);color:var(--white);user-select:none;-webkit-user-select:none}
#bar{position:fixed;left:0;right:0;top:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:50;
  background:linear-gradient(90deg,#ff5fb0,#7b5cff,#2de2e6);box-shadow:0 4px 18px rgba(0,0,0,.4)}
#bar .logo{font-weight:700;font-size:28px;letter-spacing:3px;text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
#bar .grp{display:flex;gap:8px;align-items:center}
.pill{border:3px solid #fff;background:rgba(43,27,74,.55);color:#fff;font:700 16px var(--font);border-radius:999px;padding:5px 14px;cursor:pointer}
.pill.on{background:#fff;color:var(--ink)}
.pill:hover{transform:scale(1.06)}
#stage{position:absolute;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;touch-action:none;background:#2a0f5a;border-radius:18px;box-shadow:0 0 60px rgba(255,95,176,.45)}
#c{position:absolute;left:0;top:0;width:1280px;height:720px}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;z-index:10}
.hidden{display:none!important}
.title{font-weight:700;font-size:150px;line-height:1;letter-spacing:10px;margin:0;
  background:linear-gradient(90deg,#ff5fb0,#ffe14d,#2de2e6,#ff5fb0);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(5px 6px 0 var(--ink)) drop-shadow(0 0 20px rgba(255,255,255,.7));animation:rainbow 4s linear infinite,bob 2s ease-in-out infinite}
@keyframes rainbow{to{background-position:300% 0}}
@keyframes bob{50%{transform:translateY(-8px) rotate(-1.5deg)}}
.tag{font-size:26px;font-weight:700;text-shadow:2px 2px 0 var(--ink);margin:0}
.btn{font:700 34px var(--font);color:var(--ink);background:linear-gradient(180deg,#fff6a8,#ffd23d);border:5px solid #fff;border-radius:999px;padding:12px 44px;cursor:pointer;
  box-shadow:0 7px 0 #c8870a,0 12px 22px rgba(0,0,0,.4);transition:transform .08s;position:relative}
.btn.pink{background:linear-gradient(180deg,#ffb3dc,#ff5fb0);box-shadow:0 7px 0 #b3267a,0 12px 22px rgba(0,0,0,.4)}
.btn.cyan{background:linear-gradient(180deg,#b6fbff,#2de2e6);box-shadow:0 7px 0 #138e93,0 12px 22px rgba(0,0,0,.4)}
.btn.small{font-size:22px;padding:8px 26px}
.btn:hover,.btn.hov{transform:scale(1.07) rotate(-1deg)}
.btn:active{transform:translateY(5px)}
.btn:disabled{filter:grayscale(.8);opacity:.5;cursor:default}
.row{display:flex;gap:22px;align-items:center;justify-content:center}
#menu{background:radial-gradient(ellipse at center,rgba(26,11,58,.88) 0%,rgba(26,11,58,.7) 60%,rgba(26,11,58,.45) 100%);gap:8px}
.btn.big{font-size:44px;padding:18px 62px}
.steps{display:flex;gap:16px;align-items:center;font-size:26px;margin-top:22px;background:rgba(255,255,255,.14);border-radius:999px;padding:10px 30px}
.steps i{font-style:normal;opacity:.7;font-size:34px}
.steps b{font-weight:700}
.menulink{font:700 24px var(--font);color:#fff;background:transparent;border:3px solid rgba(255,255,255,.7);border-radius:999px;padding:8px 24px;cursor:pointer}
.menulink:hover{background:rgba(255,255,255,.2)}
.privacy{font-size:16px;opacity:.75;margin:10px 0 0}
.chip{font-size:26px;font-weight:700;border:4px solid #fff;border-radius:999px;padding:6px 24px;background:rgba(255,255,255,.15)}
.chip.ok{background:#3ecf6a;color:#06301a}
#goScores small{display:block;font-size:20px;font-weight:500;opacity:.9}
.hint{max-width:760px;font-size:22px;background:rgba(43,27,74,.6);padding:10px 22px;border-radius:22px;border:3px dashed rgba(255,255,255,.6);margin:0}
#overlayDim{background:rgba(26,11,58,.55)}
.panel{background:rgba(43,27,74,.88);border:5px solid #fff;border-radius:34px;padding:26px 40px;box-shadow:0 0 40px rgba(255,95,176,.6)}
.panel label{display:flex;align-items:center;justify-content:space-between;gap:30px;font-size:26px;margin:14px 0}
select,input[type=range]{font:700 22px var(--font);border-radius:14px;padding:6px 10px}
input[type=checkbox]{width:28px;height:28px}
#goTitle{font-size:110px;font-weight:700;margin:0;color:#fff;letter-spacing:8px;text-shadow:5px 5px 0 #d6007a,-3px -3px 0 var(--cyan);animation:flick 1.1s steps(2) infinite}
@keyframes flick{50%{opacity:.78;transform:scale(1.03)}}
#goScores{font-size:34px;font-weight:700;display:flex;gap:40px}
#goScores span{background:rgba(255,255,255,.15);padding:6px 22px;border-radius:20px;border:3px solid #fff}
#entryMsg{font-size:30px;font-weight:700;margin-bottom:8px}
#slots{display:flex;gap:18px;justify-content:center;margin-bottom:12px}
.slot{width:86px;height:104px;border:5px solid #fff;border-radius:20px;background:rgba(255,255,255,.12);font-size:76px;font-weight:700;line-height:96px;color:var(--yellow);text-shadow:3px 3px 0 var(--ink)}
.slot.cur{border-color:var(--yellow);animation:blinkb .6s steps(2) infinite}
@keyframes blinkb{50%{background:rgba(255,225,77,.35)}}
#kbd{display:grid;grid-template-columns:repeat(9,66px);gap:8px;justify-content:center}
#kbd button,.kb{font:700 30px var(--font);height:58px;border-radius:16px;border:3px solid #fff;background:linear-gradient(180deg,#d9c8ff,#8c6bff);color:#fff;text-shadow:2px 2px 0 var(--ink);cursor:pointer;box-shadow:0 4px 0 #4a2fb0}
#kbd button:hover,#kbd button.hov,.kb:hover,.kb.hov{background:linear-gradient(180deg,#fff6a8,#ffd23d);color:var(--ink);text-shadow:none}
#kbd button.wide{grid-column:span 2}
#board{border-collapse:separate;border-spacing:0 8px;font-size:38px;font-weight:700;min-width:520px}
#board td{background:rgba(255,255,255,.14);padding:6px 24px}
#board td:first-child{border-radius:18px 0 0 18px;color:var(--yellow)}
#board td:last-child{border-radius:0 18px 18px 0;text-align:right}
#board tr.me td{background:linear-gradient(90deg,#ff5fb0,#ffd23d);color:var(--ink);animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{to{filter:brightness(1.25)}}
#board th{font-size:22px;opacity:.8;padding:0 24px;text-align:left}
#boardTitle{font-size:56px;margin:0;font-weight:700;color:var(--yellow);text-shadow:4px 4px 0 var(--ink)}
#winner{font-size:40px;font-weight:700;color:var(--cyan);text-shadow:3px 3px 0 var(--ink);margin:0}
#loading{background:rgba(26,11,58,.85);z-index:30}
#loading .spin{font-size:90px;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loadMsg{font-size:34px;font-weight:700}
#toast{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);background:#fff;color:var(--ink);font-weight:700;font-size:22px;padding:10px 24px;border-radius:999px;z-index:40;border:4px solid var(--pink);max-width:1100px;text-align:center}
.hcursor{position:absolute;left:0;top:0;width:0;height:0;z-index:60;pointer-events:none}
.hcursor i{position:absolute;left:-52px;top:-52px;width:104px;height:104px;border-radius:50%;border:7px solid #fff;background:rgba(255,255,255,.2);
  box-shadow:0 0 26px var(--cyan),inset 0 0 18px rgba(255,255,255,.5);font-style:normal;font-size:56px;line-height:90px;text-align:center}
.hcursor.pinch i{background:rgba(255,225,77,.6);transform:scale(.85);border-color:var(--yellow)}
.hcursor.p1 i{border-color:var(--pink)}.hcursor.p2 i{border-color:var(--cyan)}
</style>
</head>
<body>
<div id="bar">
  <div class="logo">BDOU 🍣</div>
  <div class="grp" id="langGrp">
    <button class="pill" data-lang="en">EN</button>
    <button class="pill" data-lang="sv">SV</button>
  </div>
  <div class="grp">
    <button class="pill" id="quitBtn" style="display:none" data-i18n="quit"></button>
    <button class="pill" id="fsBtn" data-i18n-title="fullscreen">⛶</button>
    <button class="pill" id="muteBtn" title="Sound">🔊</button>
    <button class="pill" id="setBtn" data-i18n-title="settings">⚙️</button>
  </div>
</div>

<div id="stage">
  <canvas id="c" width="1920" height="1080"></canvas>

  <!-- MENU -->
  <div class="screen" id="menu">
    <h1 class="title">BDOU</h1>
    <p class="tag" data-i18n="tagline"></p>
    <div class="row" style="margin-top:14px">
      <button class="btn pink big" id="play1" data-i18n="play1"></button>
      <button class="btn cyan big" id="play2" data-i18n="play2"></button>
    </div>
    <div class="steps">
      <span>👋 <b data-i18n="step1"></b></span><i>›</i>
      <span>🍣 <b data-i18n="step2"></b></span><i>›</i>
      <span>📦 <b data-i18n="step3"></b></span>
    </div>
    <div class="row" style="gap:14px;margin-top:6px">
      <button class="menulink" id="hsBtn">🏆 <span data-i18n="highscores"></span></button>
      <button class="menulink" id="menuSet">⚙️ <span data-i18n="settings"></span></button>
    </div>
    <p class="privacy" data-i18n="privacy"></p>
  </div>

  <!-- HIGH SCORES (from menu) -->
  <div class="screen hidden" id="hsScreen" style="background:rgba(26,11,58,.8)">
    <h2 id="boardTitle2" style="font-size:56px;margin:0;color:var(--yellow);text-shadow:4px 4px 0 var(--ink)" data-i18n="highscores"></h2>
    <table id="board2"></table>
    <button class="btn" id="hsBack" data-i18n="back"></button>
  </div>

  <!-- SETTINGS -->
  <div class="screen hidden" id="settings" style="background:rgba(26,11,58,.75)">
    <div class="panel">
      <h2 style="margin:0 0 6px;font-size:44px" data-i18n="settings"></h2>
      <label><span data-i18n="duration"></span><select id="durSel"></select></label>
      <label><span data-i18n="volume"></span><input type="range" id="volRange" min="0" max="1" step="0.05"></label>
      <label><span data-i18n="diff"></span><select id="diffSel"></select></label>
      <label><span data-i18n="calm"></span><input type="checkbox" id="calmChk"></label>
      <label><span data-i18n="useCam"></span><input type="checkbox" id="camChk"></label>
      <label><span data-i18n="backdrop"></span><input type="checkbox" id="bdChk"></label>
      <label><span data-i18n="zoom"></span><input type="range" id="zoomRange" min="1" max="2.5" step="0.1"></label>
      <div class="row" style="margin-top:20px"><button class="btn" id="setClose" data-i18n="back"></button></div>
    </div>
  </div>

  <!-- LOADING -->
  <div class="screen hidden" id="loading">
    <div class="spin">🍣</div>
    <div id="loadMsg"></div>
  </div>

  <!-- CAMERA CALIBRATION -->
  <div class="screen hidden" id="calib" style="justify-content:flex-end;padding-bottom:26px;pointer-events:none">
    <div class="panel" style="pointer-events:auto;padding:16px 30px">
      <h2 style="margin:0;font-size:40px" data-i18n="calibTitle"></h2>
      <div id="calibChips" class="row" style="margin:10px 0"></div>
      <label style="margin:6px 0"><span data-i18n="zoom"></span><input type="range" id="zoomRange2" min="1" max="2.5" step="0.1"></label>
      <button class="btn small" id="calibGo" data-i18n="start"></button>
    </div>
  </div>

  <!-- GAME OVER -->
  <div class="screen hidden" id="over" style="background:rgba(26,11,58,.78);gap:10px">
    <h1 id="goTitle"></h1>
    <div id="goScores"></div>
    <div id="entry" class="hidden">
      <div id="entryMsg"></div>
      <div id="slots"><div class="slot"></div><div class="slot"></div><div class="slot"></div></div>
      <div id="kbd"></div>
    </div>
    <div id="boardWrap" class="hidden" style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <h2 id="boardTitle" data-i18n="highscores"></h2>
      <p id="winner"></p>
      <table id="board"></table>
      <div class="row" style="margin-top:6px">
        <button class="btn pink" id="again" data-i18n="again"></button>
        <button class="btn cyan" id="toMenu" data-i18n="menu"></button>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>
</div>

<script type="module">
'use strict';
/* =========================================================
   BDOU – Disco Sushi Train
   Single file. Webcam hand tracking via MediaPipe (CDN),
   mouse / touch fallback. Web Audio oscillator sound.
   ========================================================= */
const $ = id => document.getElementById(id);
const W = 1280, H = 720;
const FONT = "Fredoka,'Baloo 2','Chalkboard SE','Comic Sans MS','Arial Rounded MT Bold',sans-serif";
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------------- i18n ---------------- */
const T = {
  en: {
    tagline: 'Sort the sushi pals into their boxes!',
    play1: '1 PLAYER', play2: '2 PLAYERS', highscores: 'High Scores', settings: 'Settings',
    step1: 'Touch sushi', step2: 'Carry it', step3: 'Match the box',
    back: 'Back', quit: 'Quit', useCam: 'Use camera', zoom: 'Camera zoom (distance)',
    privacy: '🔒 Camera video stays on this device – nothing is uploaded.',
    diff: 'Difficulty', easy: 'Easy', normal: 'Normal', hard: 'Hard', calm: 'Calm mode (no shake or flashing)',
    calibTitle: 'Stand about 2 m back and wave!', calibWait: 'Waiting for you…', calibOk: 'I can see you!', start: 'Start', fullscreen: 'Fullscreen',
    lost: "I can't see you!", tut: 'Touch the sushi, carry it to its box!', sorted: 'sorted', best: 'best combo', acc: 'accuracy',
    camDenied: 'Camera permission was blocked – playing with mouse / touch instead.', camNone: 'No camera found – playing with mouse / touch instead.',
    duration: 'Game time', volume: 'Volume', backdrop: 'Show camera behind game',
    loadCam: 'Waking up the camera…', loadModel: 'Loading hand magic…', camErr: 'Camera not available – playing with mouse / touch instead.',
    mouseMode: 'Mouse / touch mode: move over a sushi to grab it, then drag it down into its box!',
    score: 'SCORE', time: 'TIME', combo: 'COMBO', gameover: 'GAME OVER', enter: 'ENTER YOUR INITIALS', enterP: 'ENTER INITIALS', del: '⌫', ok: 'OK',
    rank: 'RANK', name: 'NAME', pts: 'SCORE', again: 'Play Again', menu: 'Menu',
    winner: 'Player {n} wins!', tie: "It's a tie!", maki: 'Maki', sashimi: 'Sashimi', avo: 'Avocado', boba: 'Bubble tea', p: 'P',
    yum: ['YUM!', 'TASTY!', 'NICE!', 'YAY!'], oops: 'OOPS!', miss: 'MISS', bonus: 'BONUS!', faster: 'FASTER!',
    cm: { 3: 'COMBO!', 5: 'GREAT!', 8: 'SUPER!', 12: 'AMAZING!', 16: 'MEGA!', 20: 'INSANE!' }, go: 'GO!'
  },
  sv: {
    tagline: 'Sortera sushikompisarna i rätt lådor!',
    play1: '1 SPELARE', play2: '2 SPELARE', highscores: 'Topplista', settings: 'Inställningar',
    step1: 'Rör sushin', step2: 'Bär den', step3: 'Rätt låda',
    back: 'Tillbaka', quit: 'Avsluta', useCam: 'Använd kamera', zoom: 'Kamerazoom (avstånd)',
    privacy: '🔒 Kamerabilden stannar på din enhet – inget laddas upp.',
    diff: 'Svårighet', easy: 'Lätt', normal: 'Normal', hard: 'Svår', calm: 'Lugnt läge (ingen skakning eller blinkningar)',
    calibTitle: 'Stå cirka 2 m bort och vinka!', calibWait: 'Väntar på dig…', calibOk: 'Jag ser dig!', start: 'Start', fullscreen: 'Helskärm',
    lost: 'Jag ser dig inte!', tut: 'Rör sushin och bär den till rätt låda!', sorted: 'sorterade', best: 'bästa kombo', acc: 'träffsäkerhet',
    camDenied: 'Kameratillståndet blockerades – du spelar med mus / touch istället.', camNone: 'Ingen kamera hittades – du spelar med mus / touch istället.',
    duration: 'Speltid', volume: 'Volym', backdrop: 'Visa kameran bakom spelet',
    loadCam: 'Väcker kameran…', loadModel: 'Laddar handmagi…', camErr: 'Kameran fungerar inte – du spelar med mus / touch istället.',
    mouseMode: 'Mus / touch: rör vid en sushi för att ta den, dra ner den i rätt låda!',
    score: 'POÄNG', time: 'TID', combo: 'KOMBO', gameover: 'SPELET SLUT', enter: 'SKRIV DINA INITIALER', enterP: 'SKRIV INITIALER', del: '⌫', ok: 'OK',
    rank: 'PLATS', name: 'NAMN', pts: 'POÄNG', again: 'Spela igen', menu: 'Meny',
    winner: 'Spelare {n} vinner!', tie: 'Det blev oavgjort!', maki: 'Maki', sashimi: 'Sashimi', avo: 'Avokado', boba: 'Bubbelte', p: 'S',
    yum: ['NAM!', 'GOTT!', 'BRA!', 'JIPPI!'], oops: 'HOPPSAN!', miss: 'MISS', bonus: 'BONUS!', faster: 'SNABBARE!',
    cm: { 3: 'KOMBO!', 5: 'BRA!', 8: 'SUPER!', 12: 'FANTASTISKT!', 16: 'MEGA!', 20: 'GALET!' }, go: 'KÖR!'
  }
};

/* ---------------- settings / storage ---------------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const S = Object.assign({ lang: (navigator.language || '').toLowerCase().startsWith('sv') ? 'sv' : 'en', dur: 75, vol: 0.6, mute: false, backdrop: true, cam: true, zoom: 1.5, diff: 'normal', calm: false }, LS.get('bdou.settings', {}));
const saveS = () => LS.set('bdou.settings', S);
const t = k => T[S.lang][k];

const HS_KEY = 'bdou.highscores.v1';
function loadHS() {
  const a = LS.get(HS_KEY, []);
  return (Array.isArray(a) ? a : []).filter(e => e && typeof e.score === 'number' && typeof e.name === 'string')
    .sort((x, y) => y.score - x.score || x.date - y.date).slice(0, 5);
}
function qualifies(s) { const h = loadHS(); return s > 0 && (h.length < 5 || s > h[h.length - 1].score); }
function addHS(name, score, mode) {
  const e = { id: Date.now() + '-' + Math.random().toString(36).slice(2, 6), name, score, mode, date: Date.now() };
  const h = loadHS(); h.push(e);
  h.sort((x, y) => y.score - x.score || x.date - y.date);
  LS.set(HS_KEY, h.slice(0, 5));
  return e.id;
}

/* ---------------- audio (oscillators only) ---------------- */
let AC = null, master = null, noiseBuf = null;
function ac() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    applyAudio();
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function applyAudio() { if (master) master.gain.value = S.mute ? 0 : S.vol; $('muteBtn').textContent = S.mute ? '🔇' : '🔊'; }
function tone(f, d = .15, type = 'square', v = .2, at = 0, to = null) {
  const a = ac(), t0 = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + d);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + d + .03);
}
function noise(d, v, at, hp = 6000) {
  const a = ac(), t0 = a.currentTime + at, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp;
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + d);
  s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0 + d + .02);
}
const sfx = {
  grab() { tone(520, .09, 'triangle', .22, 0, 900); },
  good(c) { const m = 1 + Math.min(c, 14) * .035; [523, 659, 784].forEach((f, i) => tone(f * m, .13, 'square', .14, i * .06)); },
  combo() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, .14, 'triangle', .22, i * .06)); },
  wrong() { tone(220, .32, 'sawtooth', .22, 0, 80); tone(160, .32, 'square', .12, .02, 60); },
  boba() { [660, 880, 1100, 1320, 1760, 2093].forEach((f, i) => tone(f, .16, 'sine', .22, i * .05)); },

  }
  G.speed = G.state === 'play' ? beltSpeed(G.el) : 100;
  G.beltDist += G.speed * dt;

  // spawning
  if (G.state === 'play' || G.state === 'menu' || G.state === 'over') {
    G.lanes.forEach((l, i) => {
      l.spawnT -= dt;
      if (l.spawnT <= 0) {
        spawn(l, i);
        const spacing = G.state === 'play' ? Math.max(200, 270 - G.step * 4) * dm().space : 260;
        l.spawnT = spacing / G.speed * rnd(.85, 1.4);
      }
    });
  }

  // pointers
  for (const [id, p] of pointers) {
    if (p.hand && clock - p.seen > .35) p.dead = true;
    if (G.state === 'play' && !p.dead) {
      // touching a sushi = grabbing it
      if (!p.held) {
        const li = laneAt(p.x); let best = null, bd = 1e9;
        for (const it of items) {
          if (it.st !== 'belt' || it.lane !== li) continue;
          const d = Math.hypot(it.x - p.x, it.y - p.y);
          if (d < 80 * it.sz && d < bd) { best = it; bd = d; }
        }
        if (best) { best.st = 'held'; best.p = p; p.held = best; sfx.grab(); burst(best.x, best.y, 6, ['#fff', '#ffe14d'], 220); }
      }
      if (p.held) {
        const it = p.held, lane = G.lanes[it.lane];
        it.x += (clamp(p.x, lane.x0 + 40, lane.x0 + lane.w - 40) - it.x) * Math.min(1, dt * 28);
        it.y += (clamp(p.y, 90, H - 40) - it.y) * Math.min(1, dt * 28);
        // carried into the box area = dropped in
        if (it.y >= BOX_TOP - 10) { p.held = null; drop(it, p); }

    } else if (p.held) { p.held.st = 'belt'; p.held.p = null; p.held = null; }

  }

  // items
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i], lane = G.lanes[it.lane];
    if (!lane) { items.splice(i, 1); continue; }
    it.ph += dt * 6;
    if (it.st === 'belt') {
      it.x -= G.speed * dt;
      it.y += (ITEM_Y + Math.sin(it.ph) * 3 - it.y) * Math.min(1, dt * 12);
      it.rot = Math.sin(it.ph * .7) * .06;
      it.scale = 1 + Math.sin(it.ph * 1.3) * .03;
      if (it.x < lane.x0 - 80) {
        items.splice(i, 1);
        if (G.state === 'play' && it.type !== 'boba') {
          if (lane.combo > 2) pop(t('miss'), lane.x0 + 90, ITEM_Y, '#ff9f9f', 40);
          lane.combo = 0; lane.missed++; sfx.miss();

  // fx
  for (let i = parts.length - 1; i >= 0; i--) { const q = parts[i]; q.age += dt; q.vy += 900 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.rot += dt * 6; if (q.age > q.life) parts.splice(i, 1); }
  for (let i = pops.length - 1; i >= 0; i--) { const q = pops[i]; q.age += dt; q.y -= 40 * dt; if (q.age > q.life) pops.splice(i, 1); }
  shakeAmp *= Math.pow(.02, dt); if (shakeAmp < .3) shakeAmp = 0;
  flashA = Math.max(0, flashA - dt * 2);
  updateCursors();
}

/* hand cursors (gameplay only – menus and leaderboard use mouse / touch / keyboard) */
function updateCursors() {
  for (const p of pointers.values()) {
    if (!p.hand) continue;
    if (!p.el) { p.el = document.createElement('div'); p.el.className = 'hcursor'; p.el.innerHTML = '<i>✋</i>'; stage.appendChild(p.el); }
    p.el.style.display = inGameNow() ? '' : 'none';
    p.el.style.transform = `translate(${p.x}px,${p.y}px)`;
    p.el.classList.toggle('pinch', !!p.held);
    p.el.classList.toggle('p1', G.lanes.length === 2 && laneAt(p.x) === 0);
    p.el.classList.toggle('p2', G.lanes.length === 2 && laneAt(p.x) === 1);
  }
}

/* ---------------- render ---------------- */

function drawBelt() {

}

  const multi = G.lanes.length === 2;
  G.lanes.forEach((l, i) => {
    const col = multi ? (i ? '#2de2e6' : '#ff5fb0') : '#ffe14d', right = i === 1;
    const x = right ? l.x0 + l.w - 20 - 250 : l.x0 + 20;

// animated "how to play" hand shown during the 3-2-1 countdown

function render() {

  drawBg();
  // each lane is its own framed screen (clipped), so 2P really is two separate frames
  const two = G.lanes.length === 2;
  if (G.state === 'calib') {
    if (two) {
      ctx.setLineDash([18, 14]); ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke(); ctx.setLineDash([]);

}

/* ---------------- main loop ---------------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}

/* ---------------- UI wiring ---------------- */
function fit() {
  const availH = innerHeight - 52 - 8;
  SCALE = Math.min(innerWidth / W, availH / H);
  stage.style.transform = `scale(${SCALE})`;
  stage.style.left = (innerWidth - W * SCALE) / 2 + 'px';
  stage.style.top = 52 + (availH - H * SCALE) / 2 + 4 + 'px';
}
addEventListener('resize', fit);

  document.documentElement.lang = S.lang;
  document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-title]').forEach(e => e.title = t(e.dataset.i18nTitle));
  document.querySelectorAll('[data-lang]').forEach(e => e.classList.toggle('on', e.dataset.lang === S.lang));
  [...$('diffSel').options].forEach(o => o.textContent = t(o.value));
  if (G.state === 'calib') buildChips();
  $('kDel').textContent = t('del'); $('kOk').textContent = t('ok');
  if (G.state === 'over') {
    $('goTitle').textContent = t('gameover');
    if (entering) startEntry(entering);
    if (!$('boardWrap').classList.contains('hidden')) showBoard();
  }
  if (!$('hsScreen').classList.contains('hidden')) renderBoard($('board2'));
}
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => { S.lang = b.dataset.lang; saveS(); sfx.click(); applyLang(); }));

// keyboard grid

  const d = document.createElement('button'); d.id = 'kDel'; d.className = 'wide'; d.addEventListener('click', delLetter); k.appendChild(d);

$('play2').addEventListener('click', () => startGame(2));
$('again').addEventListener('click', () => { show('over', false); startGame(G.lanes.length); });
$('toMenu').addEventListener('click', () => { sfx.click(); toMenu(); });
$('quitBtn').addEventListener('click', () => { sfx.click(); toMenu(); });
$('hsBtn').addEventListener('click', () => { sfx.click(); renderBoard($('board2')); show('menu', false); show('hsScreen', true); });
$('hsBack').addEventListener('click', () => { sfx.click(); show('hsScreen', false); show('menu', true); });
$('muteBtn').addEventListener('click', () => { S.mute = !S.mute; saveS(); ac(); applyAudio(); });

let settingsFrom = null;
function openSettings() { settingsFrom = ['menu', 'hsScreen', 'over'].find(id => !$(id).classList.contains('hidden')) || null; show('settings', true); }
$('setBtn').addEventListener('click', openSettings); $('menuSet').addEventListener('click', openSettings);
$('setClose').addEventListener('click', () => { sfx.click(); show('settings', false); });
const durSel = $('durSel');
[30, 45, 60, 75, 90, 120].forEach(n => { const o = document.createElement('option'); o.value = n; o.textContent = n + ' s'; durSel.appendChild(o); });
durSel.value = S.dur; durSel.addEventListener('change', () => { S.dur = +durSel.value; saveS(); });
$('volRange').value = S.vol; $('volRange').addEventListener('input', e => { S.vol = +e.target.value; S.mute = false; saveS(); applyAudio(); });
$('calibGo').addEventListener('click', () => { sfx.click(); beginCountdown(); });
$('zoomRange2').value = S.zoom; $('zoomRange2').addEventListener('input', e => { S.zoom = +e.target.value; $('zoomRange').value = S.zoom; saveS(); });
$('zoomRange').addEventListener('input', e => { $('zoomRange2').value = e.target.value; });
$('fsBtn').addEventListener('click', () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch {} });
['easy', 'normal', 'hard'].forEach(k => { const o = document.createElement('option'); o.value = k; $('diffSel').appendChild(o); });
$('diffSel').value = S.diff; $('diffSel').addEventListener('change', e => { S.diff = e.target.value; saveS(); });
$('calmChk').checked = S.calm; $('calmChk').addEventListener('change', e => { S.calm = e.target.checked; saveS(); });
$('camChk').checked = S.cam; $('camChk').addEventListener('change', e => { S.cam = e.target.checked; saveS(); });
$('zoomRange').value = S.zoom; $('zoomRange').addEventListener('input', e => { S.zoom = +e.target.value; saveS(); });
$('bdChk').checked = S.backdrop; $('bdChk').addEventListener('change', e => { S.backdrop = e.target.checked; saveS(); });

fit(); applyLang(); applyAudio();
requestAnimationFrame(t0 => { last = t0; requestAnimationFrame(frame); });
window.__bdou = { G, S, items: () => items, pointers, startGame, tracker }; // handy for debugging
</script>
</body>
</html>
