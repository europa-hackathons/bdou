<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BDOU – Disco Sushi Train</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%232b2d42'/%3E%3Ccircle cx='50' cy='50' r='36' fill='%23fff'/%3E%3Ccircle cx='50' cy='50' r='22' fill='%23ff8a65'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff5fb0;--cyan:#2de2e6;--yellow:#ffe14d;--ink:#2b1b4a;--font:'Fredoka','Baloo 2','Chalkboard SE','Comic Sans MS','Arial Rounded MT Bold',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1a0b3a;overflow:hidden;font-family:var(--font);color:#fff;user-select:none;-webkit-user-select:none}
#bar{position:fixed;left:0;right:0;top:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:50;background:linear-gradient(90deg,#ff5fb0,#7b5cff,#2de2e6);box-shadow:0 4px 18px rgba(0,0,0,.4)}
#bar .logo{font-weight:700;font-size:28px;letter-spacing:3px;text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
#bar .grp{display:flex;gap:8px;align-items:center}
.pill{border:3px solid #fff;background:rgba(43,27,74,.55);color:#fff;font:700 16px var(--font);border-radius:999px;padding:5px 14px;cursor:pointer}
.pill.on{background:#fff;color:var(--ink)}
.pill:hover{transform:scale(1.06)}
#stage{position:absolute;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;touch-action:none;background:#2a0f5a;border-radius:18px;box-shadow:0 0 60px rgba(255,95,176,.45)}
#c{position:absolute;left:0;top:0;width:1280px;height:720px}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;z-index:10}
.hidden{display:none!important}
#menu{background:radial-gradient(ellipse at center,rgba(26,11,58,.88) 0%,rgba(26,11,58,.7) 60%,rgba(26,11,58,.45) 100%);gap:8px}
.title{font-weight:700;font-size:150px;line-height:1;letter-spacing:10px;margin:0;background:linear-gradient(90deg,#ff5fb0,#ffe14d,#2de2e6,#ff5fb0);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(5px 6px 0 var(--ink)) drop-shadow(0 0 20px rgba(255,255,255,.7));animation:rainbow 4s linear infinite,bob 2s ease-in-out infinite}
@keyframes rainbow{to{background-position:300% 0}}
@keyframes bob{50%{transform:translateY(-8px) rotate(-1.5deg)}}
.tag{font-size:42px;font-weight:700;margin:6px 0 0;padding:8px 34px;border-radius:999px;background:rgba(43,27,74,.6);border:3px solid rgba(255,255,255,.55);text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);letter-spacing:.5px}
.btn{font:700 34px var(--font);color:var(--ink);background:linear-gradient(180deg,#fff6a8,#ffd23d);border:5px solid #fff;border-radius:999px;padding:12px 44px;cursor:pointer;box-shadow:0 7px 0 #c8870a,0 12px 22px rgba(0,0,0,.4);transition:transform .08s}
.btn.pink{background:linear-gradient(180deg,#ffb3dc,#ff5fb0);box-shadow:0 7px 0 #b3267a,0 12px 22px rgba(0,0,0,.4)}
.btn.cyan{background:linear-gradient(180deg,#b6fbff,#2de2e6);box-shadow:0 7px 0 #138e93,0 12px 22px rgba(0,0,0,.4)}
.btn.mid{font-size:28px;padding:10px 38px}
.btn.small{font-size:22px;padding:8px 26px}
.btn:hover{transform:scale(1.07) rotate(-1deg)}
.btn:active{transform:translateY(5px)}
.btn:disabled{filter:grayscale(.8);opacity:.5;cursor:default}
.row{display:flex;gap:22px;align-items:center;justify-content:center}
.steps{display:flex;gap:16px;align-items:center;font-size:26px;margin-top:22px;background:rgba(255,255,255,.14);border-radius:999px;padding:10px 30px}
.steps i{font-style:normal;opacity:.7;font-size:34px}
.steps b{font-weight:700}
.menulink{font:700 24px var(--font);color:#fff;background:transparent;border:3px solid rgba(255,255,255,.7);border-radius:999px;padding:8px 24px;cursor:pointer}
.menulink:hover{background:rgba(255,255,255,.2)}
.cambtn{font-size:22px;margin-top:4px;border-color:#7dff9b;background:rgba(62,207,106,.28)}
.cambtn[data-state=ask]{animation:hintpulse 1.4s ease-in-out infinite}
.cambtn[data-state=waking]{opacity:.85;cursor:default}
.cambtn[data-state=ready]{background:#3ecf6a;color:#06301a;border-color:#fff}
.cambtn[data-state=blocked]{border-color:#ff8f8f;background:rgba(255,77,77,.3)}
.musichint{position:absolute;top:22px;right:26px;font-size:20px;background:rgba(255,95,176,.35);animation:hintpulse 1.2s ease-in-out infinite}
@keyframes hintpulse{50%{transform:scale(1.08);box-shadow:0 0 22px rgba(255,225,77,.8)}}
.panel{background:rgba(43,27,74,.9);border:5px solid #fff;border-radius:34px;padding:26px 40px;box-shadow:0 0 40px rgba(255,95,176,.6)}
.panel label{display:flex;align-items:center;justify-content:space-between;gap:30px;font-size:24px;margin:12px 0}
select,input[type=range]{font:700 20px var(--font);border-radius:14px;padding:6px 10px}
input[type=checkbox]{width:28px;height:28px}
.chip{font-size:26px;font-weight:700;border:4px solid #fff;border-radius:999px;padding:6px 24px;background:rgba(255,255,255,.15)}
.chip.ok{background:#3ecf6a;color:#06301a}
#goTitle{font-size:78px;font-weight:700;margin:0;letter-spacing:8px;text-shadow:5px 5px 0 #d6007a,-3px -3px 0 var(--cyan);animation:flick 1.1s steps(2) infinite}
@keyframes flick{50%{opacity:.78;transform:scale(1.03)}}
#goScores{font-size:34px;font-weight:700;display:flex;gap:40px}
#goScores span{background:rgba(255,255,255,.15);padding:6px 22px;border-radius:20px;border:3px solid #fff}
#goScores small{display:block;font-size:20px;font-weight:500;opacity:.9}
#entryMsg{font-size:30px;font-weight:700;margin-bottom:8px}
#slots{display:flex;gap:18px;justify-content:center;margin-bottom:12px}
.slot{width:86px;height:104px;border:5px solid #fff;border-radius:20px;background:rgba(255,255,255,.12);font-size:76px;font-weight:700;line-height:96px;color:var(--yellow);text-shadow:3px 3px 0 var(--ink)}
.slot.cur{border-color:var(--yellow);animation:blinkb .6s steps(2) infinite}
@keyframes blinkb{50%{background:rgba(255,225,77,.35)}}
#kbd{display:grid;grid-template-columns:repeat(9,66px);gap:8px;justify-content:center}
#kbd button{font:700 30px var(--font);height:58px;border-radius:16px;border:3px solid #fff;background:linear-gradient(180deg,#d9c8ff,#8c6bff);color:#fff;text-shadow:2px 2px 0 var(--ink);cursor:pointer;box-shadow:0 4px 0 #4a2fb0}
#kbd button:hover{background:linear-gradient(180deg,#fff6a8,#ffd23d);color:var(--ink);text-shadow:none}
#kbd button:disabled{opacity:.4}
#kbd button.wide{grid-column:span 2}
.board{border-collapse:separate;border-spacing:0 6px;font-size:32px;font-weight:700;min-width:520px}
.board td{background:rgba(255,255,255,.14);padding:6px 24px}
.board td:first-child{border-radius:18px 0 0 18px;color:var(--yellow)}
.board td:last-child{border-radius:0 18px 18px 0;text-align:right}
.board tr.me td{background:linear-gradient(90deg,#ff5fb0,#ffd23d);color:var(--ink);animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{to{filter:brightness(1.25)}}
.board th{font-size:22px;opacity:.8;padding:0 24px;text-align:left}
.h2{font-size:46px;margin:0;font-weight:700;color:var(--yellow);text-shadow:4px 4px 0 var(--ink)}
#winner{font-size:40px;font-weight:700;color:var(--cyan);text-shadow:3px 3px 0 var(--ink);margin:0}
#loading{background:rgba(26,11,58,.85);z-index:30}
#loading .spin{font-size:90px;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loadMsg{font-size:34px;font-weight:700}
#toast{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);background:#fff;color:var(--ink);font-weight:700;font-size:22px;padding:10px 24px;border-radius:999px;z-index:40;border:4px solid var(--pink);max-width:1100px;text-align:center}
#debugPanel{position:absolute;left:10px;bottom:10px;z-index:45;background:rgba(0,0,0,.78);border:2px solid #7dff9b;border-radius:12px;padding:10px 12px;font:13px/1.4 system-ui,sans-serif;max-width:520px}
#debugPanel .dbg-title{font-weight:700;color:#7dff9b}
#debugPanel .dbg-row{display:flex;gap:8px;margin-top:8px;align-items:center}
#debugPanel button{font:600 13px system-ui,sans-serif;border-radius:8px;border:1px solid #7dff9b;background:#10301a;color:#fff;padding:5px 9px;cursor:pointer}
#dbgStats{white-space:pre;font-family:ui-monospace,Menlo,monospace;font-size:12px}
</style>
</head>
<body>
<div id="bar">
  <div class="logo">BDOU 🍣</div>
  <div class="grp">
    <button class="pill" data-lang="en">EN</button>
    <button class="pill" data-lang="sv">SV</button>
  </div>
  <div class="grp">
    <button class="pill hidden" id="quitBtn" data-i18n="quit"></button>
    <button class="pill" id="fsBtn" data-i18n-title="fullscreen">⛶</button>
    <button class="pill" id="muteBtn">🔊</button>
    <button class="pill" id="setBtn" data-i18n-title="settings">⚙️</button>
  </div>
</div>

<div id="stage">
  <canvas id="c"></canvas>

  <div class="screen" id="menu">
    <button class="menulink musichint" id="musicHint">🎵 <span data-i18n="tapMusic"></span></button>
    <h1 class="title">BDOU</h1>
    <p class="tag" data-i18n="tagline"></p>
    <div class="row" style="margin-top:14px">
      <button class="btn pink mid" id="play1" data-i18n="play1"></button>
      <button class="btn cyan mid" id="play2" data-i18n="play2"></button>
    </div>
    <button class="menulink cambtn hidden" id="camBtn"></button>
    <div class="steps">
      <span>👋 <b data-i18n="step1"></b></span><i>›</i>
      <span>🍣 <b data-i18n="step2"></b></span><i>›</i>
      <span>📦 <b data-i18n="step3"></b></span>
    </div>
    <div class="row" style="gap:14px;margin-top:6px">
      <button class="menulink" id="hsBtn">🏆 <span data-i18n="highscores"></span></button>
      <button class="menulink" id="menuSet">⚙️ <span data-i18n="settings"></span></button>
    </div>
  </div>

  <div class="screen hidden" id="hsScreen" style="background:rgba(26,11,58,.85)">
    <h2 class="h2" data-i18n="highscores"></h2>
    <table class="board" id="board2"></table>
    <button class="btn" id="hsBack" data-i18n="back"></button>
  </div>

  <div class="screen hidden" id="settings" style="background:rgba(26,11,58,.75);z-index:20">
    <div class="panel">
      <h2 style="margin:0 0 6px;font-size:44px" data-i18n="settings"></h2>
      <label><span data-i18n="duration"></span><select id="durSel"></select></label>
      <label><span data-i18n="diff"></span><select id="diffSel"></select></label>
      <label><span data-i18n="megaSetting"></span><input type="checkbox" id="megaChk"></label>
      <label><span data-i18n="reverseSetting"></span><input type="checkbox" id="revChk"></label>
      <label><span data-i18n="anim"></span><select id="animSel"></select></label>
      <label><span data-i18n="volume"></span><input type="range" id="volRange" min="0" max="1" step="0.05"></label>
      <label><span data-i18n="music"></span><input type="checkbox" id="musicChk"></label>
      <label><span data-i18n="useCam"></span><input type="checkbox" id="camChk"></label>
      <label><span data-i18n="cameraSel"></span><select id="camSel" style="max-width:340px"></select></label>
      <label><span data-i18n="tracking"></span><select id="trkSel"></select></label>
      <label><span data-i18n="zoom"></span><input type="range" id="zoomRange" min="1" max="2.5" step="0.1"></label>
      <label><span data-i18n="backdrop"></span><input type="checkbox" id="bdChk"></label>
      <div class="row" style="margin-top:20px"><button class="btn" id="setClose" data-i18n="back"></button></div>
    </div>
  </div>

  <div class="screen hidden" id="loading"><div class="spin">🍣</div><div id="loadMsg"></div></div>

  <div class="screen hidden" id="calib" style="justify-content:flex-end;padding-bottom:26px;pointer-events:none">
    <div class="panel" style="pointer-events:auto;padding:16px 30px">
      <h2 style="margin:0;font-size:38px" data-i18n="calibTitle"></h2>
      <div id="calibChips" class="row" style="margin:10px 0"></div>
      <label style="margin:6px 0"><span data-i18n="zoom"></span><input type="range" id="zoomRange2" min="1" max="2.5" step="0.1"></label>
      <button class="btn small" id="calibGo" data-i18n="start"></button>
    </div>
  </div>

  <div class="screen hidden" id="over" style="background:rgba(26,11,58,.78);gap:6px">
    <h1 id="goTitle"></h1>
    <div id="goScores"></div>
    <div id="entry" class="hidden">
      <div id="entryMsg"></div>
      <div id="slots"><div class="slot"></div><div class="slot"></div><div class="slot"></div></div>
      <div id="kbd"></div>
    </div>
    <div id="boardWrap" class="hidden" style="flex-direction:column;align-items:center;gap:6px;display:flex">
      <h2 class="h2" data-i18n="highscores"></h2>
      <p id="winner"></p>
      <table class="board" id="board"></table>
      <div class="row" style="margin-top:6px">
        <button class="btn pink" id="again" data-i18n="again"></button>
        <button class="btn cyan" id="toMenu" data-i18n="menu"></button>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>
</div>
<script type="module">
'use strict';
// ===== util.js =====
// Small shared helpers.
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rndRange = (a, b) => a + Math.random() * (b - a);
const nowMs = () => performance.now();

// ===== config.js =====
// Every tunable number in the game lives here (SPEC §5, §7, §8).


const W = 1280, H = 720; // logical play-area size; the canvas is scaled to fit the window

const CONFIG = {
  layout: { beltTop: 255, beltH: 96, itemY: 200, boxTop: 450, boxH: 225 },
  itemRadius: 60,                       // sushi radius at scale 1
  itemScale: { 1: 1.3, 2: 1.05 },        // bigger sushi for 1P; kids play ~2 m away
  countdown: 3,
  rampEvery: 4,                          // seconds between speed steps
  difficulty: {
    easy:   { start: 110, ramp: .06, max: 260, spacing: 280 },
    normal: { start: 150, ramp: .07, max: 340, spacing: 250 },
    hard:   { start: 180, ramp: .08, max: 420, spacing: 215 }
  },
  scoring: { base: 10, comboStep: 2, comboCap: 15, wrong: 5, milestones: [3, 5, 8, 12, 16, 20] },

  // SPEC §7.5 – turning raw tracking into stable hand points
  input: {
    minWristVisibility: .5,
    minShoulderVisibility: .6,
    minShoulderWidth: .035,              // fraction of the camera frame
    hipMargin: .02,                      // wrist must be at least this far above the hip
    confirmFrames: 3,
    confirmGapMs: 150,                   // frames further apart than this do not count as "in a row"
    jumpRejectPx: 260,
    jumpConfirmFrames: 3,
    oneEuro: { minCutoff: 1.2, beta: .004, dCutoff: 1 },
    lostAfterMs: 150,                    // shown faded after this
    lossGraceMs: 600,
    lossGraceHoldingMs: 1000,
    mouseIdleMs: 1500,
    handMatchPx: 230,                    // hand-tracking mode: max distance to keep a hand's identity
    reachPastWrist: 1.3,                 // body mode: hand point = wrist + 1.3 × (wrist→fingers)
    edgeMarginPx: 40
  },

  // SPEC §8 – grab / carry / drop
  interaction: {
    reachCamera: 1.9,                    // × sushi radius
    reachPointer: 1.35,
    lagCompMs: 180,
    followRate: 28,
    dropBelowBeltPx: 90,                 // the drop zone starts this far below the belt…
    dropDwellMs: 220,                    // …and the hand must stay over one box this long (so diagonal moves don't drop early)
    minHoldMs: 250,
    floatMs: 1500,
    sinkMs: 300
  },

  // SPEC §12.2 – belt reversal: first flip (s), then every [min, max] s, after a warning
  reversal: {
    easy:   { first: 30, every: [11, 14] },
    normal: { first: 22, every: [9, 12] },
    hard:   { first: 14, every: [7, 10] },
    warnSec: 1.6,          // "⇄ REVERSE!" warning before the flip
    ease: 2.2,             // how quickly the belt slows, stops and runs the other way
    quietEnd: 4            // no new flip in the last few seconds
  },

  // SPEC §12.1 – mega sushi
  mega: { mergeDist: 2.2, scale: 1.7, base: 100, comboStep: 4, wrong: 15, floatMs: 4000, tipAt: 6 },

  tracker: {
    base: 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14',
    models: {
      pose: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task',
      hand: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'
    },
    detectWidth: { 1: 640, 2: 960 },
    numPoses: 2,
    numHands: 4
  },

  durations: [30, 45, 60, 90],
  defaults: { lang: 'en', dur: 60, diff: 'easy', vol: .6, mute: false, cam: true, zoom: 1.5, backdrop: true, track: 'pose', mega: true, music: true, anim: 'kawaii', reverse: true, camId: 'auto' }
};

const BOX_TYPES = ['maki', 'sashimi', 'avo'];

// characters for the 1P / 2P intros
const ROSTER = [
  { key: 'maki', name: 'MAKI-CHAN' },
  { key: 'sashimi', name: 'SASHIMI-KUN' },
  { key: 'avo', name: 'AVO-SAN' },
  { key: 'tamago', name: 'TAMAGO-CHAN' },
  { key: 'onigiri', name: 'ONIGIRI-KUN' }
];

function lanesFor(mode) {
  return mode === 2 ? [0, 1].map(i => ({ x0: 14 + i * 646, w: 606 })) : [{ x0: 0, w: W }];
}
function laneAt(mode, x) { return mode === 2 ? (x < W / 2 ? 0 : 1) : 0; }
function boxIndexAt(lane, x) { return clamp(Math.floor((x - lane.x0) / (lane.w / 3)), 0, 2); }
function boxCenter(lane, i) { const bw = lane.w / 3; return { x: lane.x0 + bw * i + bw / 2, y: CONFIG.layout.boxTop + 70 }; }
function dropLineY() { return CONFIG.layout.beltTop + CONFIG.layout.beltH + CONFIG.interaction.dropBelowBeltPx; }

// ===== i18n.js =====
// English / Swedish strings.
const STRINGS = {
  en: {
    tagline: 'Catch the disco sushi before it rolls away!',
    play1: '1 PLAYER', play2: '2 PLAYERS', highscores: 'High Scores', settings: 'Settings',
    step1: 'Touch sushi', step2: 'Carry it', step3: 'Match the box',
    back: 'Back', quit: 'Quit', start: 'Start', fullscreen: 'Fullscreen',
    duration: 'Game time', diff: 'Difficulty', easy: 'Easy', normal: 'Normal', hard: 'Hard', volume: 'Volume',
    useCam: 'Use camera', tracking: 'Tracking', trk_pose: 'Body (best at 2 m)', trk_hand: 'Hands (close up)',
    zoom: 'Camera zoom (distance)', backdrop: 'Show camera behind game',
    loadCam: 'Waking up the camera…', loadModel: 'Loading body tracking…',
    camErr: 'Camera not available – playing with mouse / touch instead.',
    camDenied: 'Camera permission was blocked – playing with mouse / touch instead.',
    camNone: 'No camera found – playing with mouse / touch instead.',
    mouseMode: 'Mouse / touch mode: touch a sushi, then drag it down into its box!',
    calibTitle: 'Stand about 2 m back and raise your hands!', calibWait: 'Waiting for you…', calibOk: 'I can see you!',
    score: 'SCORE', combo: 'COMBO', go: 'GO!', faster: 'FASTER!', tut: 'Touch the sushi, carry it to its box!',
    gameover: 'GAME OVER', enter: 'ENTER YOUR INITIALS', del: '⌫', ok: 'OK',
    rank: 'RANK', name: 'NAME', pts: 'SCORE', again: 'Play Again', menu: 'Menu',
    winner: 'Player {n} wins!', tie: "It's a tie!", sorted: 'sorted', best: 'best combo', acc: 'accuracy',
    maki: 'Maki', sashimi: 'Sashimi', avo: 'Avocado', p: 'P',
    reverse: 'REVERSE!', reverseSetting: 'Belt reversals',
    cameraSel: 'Camera', camAuto: 'Auto (prefer webcam)', camN: 'Camera {n}', camUsing: '🎥 Using camera: {name}',
    tapMusic: 'Tap for disco music!', music: 'Music', anim: 'Animation style', anim_kawaii: 'Kawaii', anim_anime: 'Anime (beta)',
    camAsk: '📷 Allow the camera so the sushi can see you!', camWaking: '📷 Waking up the camera…', camReady: '📷 Camera ready!', camBlocked: '📷 Camera blocked – tap for help',
    camHelp: 'To allow the camera: click the camera or 🔒 icon at the left of the address bar, choose Allow, then reload the page.',
    introSpark: '✨ Sushi sparkle power… ✨', introChef: 'SUSHI CHEF, TRANSFORM!', introReady: 'READY!', introGet: 'GET READY…', introSort: "LET'S SORT!", skip: 'tap or press any key to skip',
    mega: 'MEGA SUSHI!', merge: 'MERGE!', tipMega: 'TIP: two hands + two of the same sushi = MEGA SUSHI!', megaSetting: 'Mega sushi (two hands)',
    yum: ['YUM!', 'TASTY!', 'NICE!', 'YAY!'], oops: 'OOPS!', miss: 'MISS',
    cm: { 3: 'COMBO!', 5: 'GREAT!', 8: 'SUPER!', 12: 'AMAZING!', 16: 'MEGA!', 20: 'INSANE!' }
  },
  sv: {
    tagline: 'Fånga discosushin innan den rullar iväg!',

// Settings and top-5 high scores in localStorage. A storage object can be passed in for tests.
const SETTINGS_KEY = 'bdou.v1.settings', SCORES_KEY = 'bdou.v1.highscores';

  try { const v = st && st.getItem(key); return v == null ? fallback : JSON.parse(v); } catch { return fallback; }
}
function writeJSON(key, value, st) { try { st && st.setItem(key, JSON.stringify(value)); } catch { /* storage full or blocked */ } }

function loadSettings(defaults, st = defaultStore()) {
  const saved = readJSON(SETTINGS_KEY, {}, st);
  return Object.assign({}, defaults, saved && typeof saved === 'object' ? saved : {});
}
function saveSettings(s, st = defaultStore()) { writeJSON(SETTINGS_KEY, s, st); }

function loadScores(st = defaultStore()) {
  const a = readJSON(SCORES_KEY, [], st);
  return (Array.isArray(a) ? a : [])
    .filter(e => e && typeof e.score === 'number' && typeof e.name === 'string')
    .sort((x, y) => y.score - x.score || x.date - y.date)
    .slice(0, 5);
}
function qualifies(score, st = defaultStore()) {
  const h = loadScores(st);
  return score > 0 && (h.length < 5 || score > h[h.length - 1].score);
}
function addScore(name, score, mode, st = defaultStore(), date = Date.now()) {
  const entry = { id: `${date}-${Math.random().toString(36).slice(2, 7)}`, name: String(name).slice(0, 3).toUpperCase(), score, mode, date };
  const h = loadScores(st); h.push(entry);
  h.sort((x, y) => y.score - x.score || x.date - y.date);
  writeJSON(SCORES_KEY, h.slice(0, 5), st);

}

// Web Audio oscillator sound effects and a disco music loop. No audio files.
let AC = null, master = null, noiseBuf = null;
const audioState = { vol: .6, mute: false };

function ctxA() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * .5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    applyVolume();
  }

  return AC;
}
function applyVolume() { if (master) master.gain.value = audioState.mute ? 0 : audioState.vol; }

  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + d);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + d + .03);
}
function noise(d, v, at, hp) {
  const a = ctxA(), t0 = a.currentTime + Math.max(0, at), s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp;

  s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0 + d + .02);
}

// filtered noise with an optional frequency sweep (thunder, whooshes)
function noiseSweep(d, v, at, type, f0, f1 = f0) {
  const a = ctxA(), t0 = a.currentTime + Math.max(0, at), s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = noiseBuf; s.loop = true; f.type = type; f.Q.value = type === 'bandpass' ? 1.2 : .7;

  s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0 + d + .05);
}

/* ---------- disco music: a 4-bar loop on a 16th-note step sequencer ---------- */
// Am7 – Dm7 – G7 – Cmaj7: octave-bouncing bass, offbeat chord stabs, four-on-the-floor, open hats, claps.
const DISCO = {
  bass: [45, 38, 43, 36],                                   // A, D, G, C (midi)
  chords: [[57, 60, 64, 67], [57, 60, 62, 65], [55, 59, 62, 65], [55, 59, 60, 64]]
};
const music = { mode: 'off', next: 0, step: 0, bpm: 120, on: true, bus: null };
const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);

function musicBus() {
  if (!music.bus) { music.bus = AC.createGain(); music.bus.gain.value = 0; music.bus.connect(master); }
  return music.bus;
}
function setMusicLevel() {
  if (!AC) return;
  const lvl = !music.on || music.mode === 'off' ? 0 : music.mode === 'intro' ? .12 : music.mode === 'menu' ? .5 : .55;
  musicBus().gain.setTargetAtTime(lvl, AC.currentTime, .25);
}
function voice(type, f, t0, d, v, { lp = 0, f2 = 0, detune = 0 } = {}) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0); o.detune.value = detune;

  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + .006); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  let node = o;

  node.connect(g); g.connect(musicBus()); o.start(t0); o.stop(t0 + d + .02);
}
function hiss(t0, d, v, type, freq, q = .7) {
  const sN = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  sN.buffer = noiseBuf; fl.type = type; fl.frequency.value = freq; fl.Q.value = q;
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  sN.connect(fl); fl.connect(g); g.connect(musicBus()); sN.start(t0, Math.random() * .3); sN.stop(t0 + d + .02);
}
function discoStep(s, t0) {
  const bar = (s >> 4) & 3, st = s & 15, game = music.mode === 'game', root = DISCO.bass[bar], chord = DISCO.chords[bar];
  const fill = bar === 3 && st >= 12;                                       // clap roll into the next loop
  // drums
  if (st % 4 === 0) { voice('sine', 160, t0, .22, .9, { f2: 42 }); voice('triangle', 90, t0, .05, .25); }
  if (st % 4 === 2) hiss(t0, .16, .16, 'highpass', 7500);                  // open hat on the offbeat
  else if (game || st % 2 === 1) hiss(t0, .03, .06, 'highpass', 9000);     // closed hats
  if (st === 4 || st === 12 || fill) { const v = fill ? .1 + (st - 12) * .05 : .28; hiss(t0, .14, v, 'bandpass', 1400, 1.2); hiss(t0 + .012, .12, v * .7, 'bandpass', 1100, 1.2); }

  if (st % 2 === 0) voice('sawtooth', midiHz(root + (st % 4 === 2 ? 12 : 0)), t0, .17, .32, { lp: 1100 });
  if (st === 15) voice('sawtooth', midiHz(root + 10), t0, .1, .22, { lp: 900 });

  if ((game || bar >= 2) && st % 2 === 1) voice('triangle', midiHz(chord[(st >> 1) % 4] + 24), t0, .12, .06);
  // string-ish swell at the top of each loop
  if (st === 0 && bar === 0) for (const m of chord) voice('sawtooth', midiHz(m + 12), t0, 1.6, .025, { lp: 2400 });

setInterval(() => {
  if (!AC || AC.state !== 'running' || music.mode === 'off') return;
  if (music.next < AC.currentTime) music.next = AC.currentTime + .05;
  while (music.next < AC.currentTime + .12) {
    discoStep(music.step, music.next);
    music.next += 60 / music.bpm / 4;
    music.step = (music.step + 1) % 64;
  }
}, 25);

const audio = {
  unlock() { try { ctxA(); setMusicLevel(); } catch { /* no audio */ } },
  play(name, arg) { try { SFX[name] && SFX[name](arg); } catch { /* audio not available */ } },
  setVolume(v) { audioState.vol = v; applyVolume(); },
  setMute(m) { audioState.mute = m; applyVolume(); },

  music(mode) {
    if (mode === music.mode) return;
    music.mode = mode;
    if (mode === 'game' || mode === 'menu') music.bpm = mode === 'game' ? 120 : 118;
    if (mode === 'game') music.step = 0;            // start the loop on a clean downbeat at GO
    setMusicLevel();
  },
  setMusicOn(on) { music.on = on; setMusicLevel(); },
  setBpm(b) { music.bpm = b; }

// ===== game.js =====
// Pure, deterministic game rules (SPEC §5, §8). No DOM, no canvas, no clock.
//   const g = createGame({ mode, difficulty, duration, seed, mega, reverse });
//   const events = stepGame(g, dt, handPoints);
// handPoints: [{ id, kind: 'body'|'hand'|'mouse'|'touch', player, x, y, lost }]



function makeRng(seed) { return { s: seed | 0 }; }
function rand(r) { // mulberry32
  r.s = (r.s + 0x6D2B79F5) | 0;
  let t = r.s;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

function createGame({ mode = 1, difficulty = 'easy', duration = 60, seed = 1, mega = true, reverse = true } = {}) {
  const rev = CONFIG.reversal[difficulty] || CONFIG.reversal.easy;
  const lanes = lanesFor(mode).map((l, i) => ({ ...l, i, score: 0, combo: 0, maxCombo: 0, sorted: 0, wrong: 0, missed: 0, spawnT: .3 + i * .35 }));
  return {
    mode, difficulty: CONFIG.difficulty[difficulty] ? difficulty : 'easy', duration,
    phase: 'countdown', cd: CONFIG.countdown, time: 0, left: duration,
    speed: 0, beltDist: 0, step: 0, lastTick: null,
    sz: CONFIG.itemScale[mode] || 1, lanes, items: [], rng: makeRng(seed), nextId: 1,
    mega: !!mega, tipShown: false,
    // belt direction: 1 = sushi move left, -1 = right; dirV eases between them so the belt slows, stops and turns
    reverse: !!reverse, dir: 1, dirV: 1, nextRev: rev.first, revWarned: false
  };
}

function beltSpeedAt(difficulty, t) {
  const d = CONFIG.difficulty[difficulty] || CONFIG.difficulty.easy;
  return Math.min(d.max, d.start * (1 + d.ramp * Math.floor(t / CONFIG.rampEvery)));
}

function itemRadius(g) { return CONFIG.itemRadius * g.sz; }
// radius of one particular sushi (a mega sushi is bigger)
function sushiRadius(g, it) { return itemRadius(g) * (it.mega ? CONFIG.mega.scale : 1); }
const isCamera = h => h.kind === 'body' || h.kind === 'hand';

function stepGame(g, dt, hands = []) {
  const ev = [];
  if (g.phase === 'countdown') {
    const before = Math.ceil(g.cd);
    g.cd -= dt;
    const after = Math.ceil(g.cd);
    if (after !== before && after >= 1) ev.push({ type: 'tick' });
    g.beltDist += 60 * dt;
    if (g.cd <= 0) { g.phase = 'play'; ev.push({ type: 'go' }); }
    return ev;
  }
  if (g.phase !== 'play') return ev;

  // clock, pace
  g.time += dt;
  g.left = Math.max(0, g.duration - g.time);
  const st = Math.floor(g.time / CONFIG.rampEvery);
  if (st !== g.step) { g.step = st; if (st % 3 === 0) ev.push({ type: 'faster' }); }
  if (g.mega && !g.tipShown && g.time >= CONFIG.mega.tipAt) { g.tipShown = true; ev.push({ type: 'tip' }); }
  if (g.left <= 5) { const s = Math.ceil(g.left); if (s !== g.lastTick && s > 0) { g.lastTick = s; ev.push({ type: 'tick' }); } }
  g.speed = beltSpeedAt(g.difficulty, g.time);
  // belt reversal: warn, then flip; the belt eases through a stop to the new direction
  const RV = CONFIG.reversal;
  if (g.reverse && g.time < g.duration - RV.quietEnd) {
    if (!g.revWarned && g.time >= g.nextRev - RV.warnSec) { g.revWarned = true; ev.push({ type: 'reverse-warn' }); }
    if (g.time >= g.nextRev) {
      const every = (RV[g.difficulty] || RV.easy).every;
      g.dir = -g.dir; g.revWarned = false; g.nextRev = g.time + every[0] + (every[1] - every[0]) * rand(g.rng);
      ev.push({ type: 'reverse', dir: g.dir });
    }
  }
  g.dirV += (g.dir - g.dirV) * Math.min(1, dt * RV.ease);
  g.beltDist += g.speed * g.dirV * dt;
  const R = itemRadius(g), L = CONFIG.layout, I = CONFIG.interaction, diff = CONFIG.difficulty[g.difficulty];

  // spawn
  for (const lane of g.lanes) {
    lane.spawnT -= dt;
    if (lane.spawnT <= 0) {
      const type = BOX_TYPES[Math.floor(rand(g.rng) * 3)];
      g.items.push({ id: g.nextId++, type, lane: lane.i, x: g.dir > 0 ? lane.x0 + lane.w + R + 10 : lane.x0 - R - 10, y: L.itemY, st: 'belt', seen: false, holder: null, heldAt: 0, dropCol: -1, dropT: 0, ft: 0, t: 0, ph: rand(g.rng) * 6 });

    }

  const byId = new Map(hands.map(h => [h.id, h]));

  const holding = new Set(g.items.filter(i => i.st === 'held').map(i => i.holder));
  for (const h of hands) {
    if (holding.has(h.id) || h.lost) continue;
    const li = g.mode === 2 ? h.player : 0;
    if (!g.lanes[li]) continue;
    const it = findGrab(g, h, li, R);
    if (it) { it.st = 'held'; it.holder = h.id; it.heldAt = g.time; holding.add(h.id); ev.push({ type: 'grab', lane: li, x: it.x, y: it.y }); }
  }

  const dropY = dropLineY(), k = Math.min(1, dt * I.followRate);
  for (const it of g.items) {
    if (it.st !== 'held') continue;
    const h = byId.get(it.holder), lane = g.lanes[it.lane], ir = sushiRadius(g, it);
    it.x += (clamp(h.x, lane.x0 + ir * .6, lane.x0 + lane.w - ir * .6) - it.x) * k;
    it.y += (clamp(h.y, 60, H - 40) - it.y) * k;
    if (h.y >= dropY && g.time - it.heldAt >= I.minHoldMs / 1000) {
      const col = boxIndexAt(lane, h.x);
      if (it.dropCol !== col) { it.dropCol = col; it.dropT = 0; } else it.dropT += dt;
      if (it.dropT >= I.dropDwellMs / 1000) drop(g, it, h.x, ev);
    } else { it.dropCol = -1; it.dropT = 0; }
  }

  if (g.mega) mergeCheck(g, ev);

  // movement
  for (let i = g.items.length - 1; i >= 0; i--) {
    const it = g.items[i], lane = g.lanes[it.lane];
    it.ph += dt * 6;
    if (it.st === 'belt') {
      it.x -= g.speed * g.dirV * dt;
      it.y += (L.itemY - it.y) * Math.min(1, dt * 12);
      if (it.x > lane.x0 + 10 && it.x < lane.x0 + lane.w - 10) it.seen = true;
      const off = sushiRadius(g, it) + 20;                          // it can leave at either end
      if (it.x < lane.x0 - off || it.x > lane.x0 + lane.w + off) {
        g.items.splice(i, 1);
        if (it.seen) { lane.combo = 0; lane.missed++; ev.push({ type: 'miss', lane: lane.i, x: lane.x0 + 90, y: L.itemY }); }
      }
    } else if (it.st === 'float') {
      it.ft -= dt;
      if (it.ft <= 0 && it.mega) drop(g, it, boxCenter(lane, BOX_TYPES.indexOf(it.type)).x, ev); // a mega sushi is never lost
      else if (it.ft <= 0) it.st = 'belt';
    } else if (it.st === 'sink') {
      it.t += dt / (I.sinkMs / 1000);
      const s = Math.min(1, it.t);
      it.x = it.sx + (it.tx - it.sx) * s;
      it.y = it.sy + (it.ty - it.sy) * s - Math.sin(s * Math.PI) * 40;
      if (it.t >= 1) g.items.splice(i, 1);
    }
  }

  if (g.left <= 0) { g.phase = 'over'; ev.push({ type: 'over' }); }
  return ev;
}

function findGrab(g, h, li, R) {
  const I = CONFIG.interaction, cam = isCamera(h);
  const reach = R * (cam ? I.reachCamera : I.reachPointer), lag = cam ? I.lagCompMs / 1000 : 0;
  let best = null, bd = Infinity;
  for (const it of g.items) {
    if (it.lane !== li || (it.st !== 'belt' && it.st !== 'float')) continue;
    const pastX = it.x + (it.st === 'belt' ? g.speed * g.dirV * lag : 0);  // where it was a moment ago (camera lag)
    const dx = Math.min(Math.abs(it.x - h.x), Math.abs(pastX - h.x)), dy = Math.abs(it.y - h.y);
    const d = dx * dx + dy * dy, rr = reach * (it.mega ? CONFIG.mega.scale : 1);
    if (d <= rr * rr && d < bd) { best = it; bd = d; }
  }
  return best;
}

function drop(g, it, handX, ev) {
  const lane = g.lanes[it.lane], S = CONFIG.scoring;
  const bi = boxIndexAt(lane, handX), c = boxCenter(lane, bi), correct = BOX_TYPES[bi] === it.type;
  it.st = 'sink'; it.holder = null; it.t = 0; it.sx = it.x; it.sy = it.y; it.tx = c.x; it.ty = c.y;
  const M = CONFIG.mega, mega = !!it.mega;
  if (correct) {
    lane.combo++; lane.sorted += mega ? 2 : 1; lane.maxCombo = Math.max(lane.maxCombo, lane.combo);
    const points = mega ? M.base + M.comboStep * Math.min(lane.combo - 1, S.comboCap) : S.base + S.comboStep * Math.min(lane.combo - 1, S.comboCap);
    lane.score += points;
    ev.push({ type: 'correct', lane: lane.i, box: bi, x: c.x, y: c.y, points, combo: lane.combo, mega, milestone: S.milestones.includes(lane.combo) });
  } else {
    const loss = mega ? M.wrong : S.wrong;
    lane.combo = 0; lane.wrong++;
    lane.score = Math.max(0, lane.score - loss);
    ev.push({ type: 'wrong', lane: lane.i, box: bi, x: c.x, y: c.y, points: -loss, mega });
  }
}

// Two sushi of the same type, held in two different hands of the same player, brought together -> one mega sushi.
function heldPairs(g) {
  const held = g.items.filter(i => i.st === 'held' && !i.mega), out = [];
  for (let a = 0; a < held.length; a++) for (let b = a + 1; b < held.length; b++)
    if (held[a].lane === held[b].lane && held[a].type === held[b].type && held[a].holder !== held[b].holder) out.push([held[a], held[b]]);
  return out;
}
function mergeCheck(g, ev) {
  const R = itemRadius(g);
  for (const [a, b] of heldPairs(g)) {
    if (Math.hypot(a.x - b.x, a.y - b.y) >= R * CONFIG.mega.mergeDist) continue;
    a.mega = true; a.x = (a.x + b.x) / 2; a.y = (a.y + b.y) / 2; a.dropCol = -1; a.dropT = 0;
    g.items.splice(g.items.indexOf(b), 1);           // the second hand is free again
    ev.push({ type: 'merge', lane: a.lane, x: a.x, y: a.y });
    return;                                         // at most one merge per step
  }
}

function gameStats(lane) {
  const tot = lane.sorted + lane.wrong + lane.missed;
  return { score: lane.score, sorted: lane.sorted, best: lane.maxCombo, accuracy: tot ? Math.round(100 * lane.sorted / tot) : 0 };
}

// ===== input.js =====
// Input contract (SPEC §7): raw tracking / mouse / touch  ->  stable hand points.
// Pure apart from the timestamps passed in, so it can be tested in Node with recorded landmarks.
//
//   const inp = createInput();
//   inputFromPose(inp, poseLandmarks, { now, mode, vw, vh, zoom });   // body tracking
//   inputFromHands(inp, handLandmarks, { now, mode });                 // hand tracking (cropped frame)
//   pointerMove(inp, id, 'mouse'|'touch', x, y, now, mode); pointerEnd(inp, id);
//   const hands = handPoints(inp, now, holdingIds);  // [{ id, kind, player, x, y, lost }]



function createInput(cfg = CONFIG.input) {
  return { cfg, ptrs: new Map(), nid: 0, debug: { people: [], rejects: [] } };
}

// One Euro filter: smooth when still, responsive when moving fast.
function euroFilter(p, x, y, tSec, c) {
  const f = p.f;
  if (!f || tSec - f.t > .5) { p.f = { t: tSec, x, y, dx: 0, dy: 0 }; return [x, y]; }
  const dt = Math.max(1e-3, tSec - f.t), alpha = cut => 1 / (1 + 1 / (2 * Math.PI * cut * dt));
  const ad = alpha(c.dCutoff);
  f.dx += ((x - f.x) / dt - f.dx) * ad;
  f.dy += ((y - f.y) / dt - f.dy) * ad;
  const a = alpha(c.minCutoff + c.beta * Math.hypot(f.dx, f.dy));
  f.x += (x - f.x) * a; f.y += (y - f.y) * a; f.t = tSec;
  return [f.x, f.y];
}

// Feed one camera detection into its (fixed-identity) hand point.
function feedCamera(inp, id, kind, player, x, y, now, mode) {
  const c = inp.cfg;
  let p = inp.ptrs.get(id);
  if (!p) { p = { id, kind, player, x, y, init: false, hits: 0, ok: false, seen: now, jumpN: 0, f: null }; inp.ptrs.set(id, p); }
  p.player = player;
  const lane = lanesFor(mode)[player];
  if (lane) x = clamp(x, lane.x0, lane.x0 + lane.w);   // a hand stays in its own player's half
  x = clamp(x, 0, W); y = clamp(y, 0, H);
  if (p.init && Math.hypot(x - p.x, y - p.y) > c.jumpRejectPx) {
    p.jumpN++;
    if (p.jumpN < c.jumpConfirmFrames) { p.seen = now; return p; }  // one-off spike: ignore
    p.f = null;                                                     // it really moved: accept, restart filter
  }
  p.jumpN = 0;
  p.hits = p.init && now - p.seen <= c.confirmGapMs ? p.hits + 1 : 1;
  if (p.hits >= c.confirmFrames) p.ok = true;
  [p.x, p.y] = euroFilter(p, x, y, now / 1000, c.oneEuro);
  p.init = true; p.seen = now;
  return p;
}

const vis = q => (q && q.visibility != null ? q.visibility : 1);

// Body tracking: landmarks are normalised to the full camera frame; screen = mirrored + zoomed.
function inputFromPose(inp, poses, { now, mode, vw, vh, zoom }) {
  const c = inp.cfg, s = Math.max(W / vw, H / vh) * zoom;
  const map = q => [W / 2 + (.5 - q.x) * vw * s, H / 2 + (q.y - .5) * vh * s];
  const rejects = [];
  inp.debug.people = poses.map(l => l.map(map));

  const people = [];
  for (const l of poses) {
    const real = vis(l[11]) > c.minShoulderVisibility && vis(l[12]) > c.minShoulderVisibility &&
      Math.hypot(l[11].x - l[12].x, l[11].y - l[12].y) > c.minShoulderWidth;
    const sx = (map(l[11])[0] + map(l[12])[0]) / 2, sy = (map(l[11])[1] + map(l[12])[1]) / 2;
    if (real) people.push({ l, sx }); else rejects.push({ x: sx, y: sy, why: 'weak person' });
  }
  people.sort((a, b) => a.sx - b.sx);

  let assign = [];
  if (mode === 2) {
    if (people.length >= 2) assign = [[people[0], 0], [people[people.length - 1], 1]];
    else if (people.length === 1) assign = [[people[0], laneAt(2, people[0].sx)]];
  } else if (people.length) {
    assign = [[people.slice().sort((a, b) => Math.abs(a.sx - W / 2) - Math.abs(b.sx - W / 2))[0], 0]];
  }

  for (const [pp, player] of assign) {
    for (const [side, w, a, b, hipI] of [['L', 15, 17, 19, 23], ['R', 16, 18, 20, 24]]) {
      const l = pp.l, wr = l[w], [wx, wy] = map(wr);
      if (vis(wr) < c.minWristVisibility) { rejects.push({ x: wx, y: wy, why: 'low confidence' }); continue; }
      if (wr.x < -.02 || wr.x > 1.02 || wr.y < -.02 || wr.y > 1.02) { rejects.push({ x: clamp(wx, 0, W), y: clamp(wy, 0, H), why: 'outside picture' }); continue; }
      const hip = l[hipI];
      if (hip && vis(hip) > .3 && wr.y > hip.y - c.hipMargin) { rejects.push({ x: wx, y: wy, why: 'resting' }); continue; }
      const [ax, ay] = map(l[a]), [bx, by] = map(l[b]);
      const hx = wx + ((ax + bx) / 2 - wx) * c.reachPastWrist, hy = wy + ((ay + by) / 2 - wy) * c.reachPastWrist;
      const m = c.edgeMarginPx;
      if (hx < -m || hx > W + m || hy < -m || hy > H + m) { rejects.push({ x: clamp(hx, 0, W), y: clamp(hy, 0, H), why: 'outside play area' }); continue; }
      feedCamera(inp, `P${player + 1}-${side}`, 'body', player, hx, hy, now, mode);
    }
  }
  inp.debug.rejects = rejects;
}

// Hand tracking: landmarks are normalised to the cropped (already zoomed) frame.
function inputFromHands(inp, handsLm, { now, mode }) {
  const c = inp.cfg, m = c.edgeMarginPx;
  inp.debug.people = handsLm.map(l => l.map(q => [(1 - q.x) * W, q.y * H]));
  inp.debug.rejects = [];
  const found = handsLm.map(l => {
    const pts = [0, 5, 9, 13, 17].map(i => [(1 - l[i].x) * W, l[i].y * H]);
    return { x: pts.reduce((a, q) => a + q[0], 0) / 5, y: pts.reduce((a, q) => a + q[1], 0) / 5 };
  }).filter(h => {
    const ok = h.x > -m && h.x < W + m && h.y > -m && h.y < H + m;
    if (!ok) inp.debug.rejects.push({ x: clamp(h.x, 0, W), y: clamp(h.y, 0, H), why: 'outside play area' });
    return ok;
  });
  const live = [...inp.ptrs.values()].filter(p => p.kind === 'hand'), used = new Set();
  for (const h of found) {
    const player = laneAt(mode, h.x);
    let best = null, bd = c.handMatchPx;
    for (const p of live) {
      if (used.has(p) || p.player !== player) continue;
      const d = Math.hypot(h.x - p.x, h.y - p.y);
      if (d < bd) { best = p; bd = d; }
    }
    const id = best ? best.id : `H${++inp.nid}`;
    used.add(feedCamera(inp, id, 'hand', player, h.x, h.y, now, mode));
  }
}

// Mouse and touch: no filtering needed; a mouse only counts while it moves.
function pointerMove(inp, id, kind, x, y, now, mode) {
  let p = inp.ptrs.get(id);
  if (!p) { p = { id, kind, init: true, ok: true, hits: 0, jumpN: 0 }; inp.ptrs.set(id, p); }
  p.x = clamp(x, 0, W); p.y = clamp(y, 0, H); p.player = laneAt(mode, p.x); p.seen = now;
}
function pointerEnd(inp, id) { inp.ptrs.delete(id); }
function clearCamera(inp) { for (const [id, p] of inp.ptrs) if (p.kind === 'body' || p.kind === 'hand') inp.ptrs.delete(id); }

function handPoints(inp, now, holding = new Set()) {
  const c = inp.cfg, out = [];
  for (const [id, p] of inp.ptrs) {
    const age = now - p.seen, cam = p.kind === 'body' || p.kind === 'hand';
    if (cam && age > (holding.has(id) ? c.lossGraceHoldingMs : c.lossGraceMs)) { inp.ptrs.delete(id); continue; }
    if (p.kind === 'mouse' && age > c.mouseIdleMs) { inp.ptrs.delete(id); continue; }
    if (!p.ok) continue;
    out.push({ id, kind: p.kind, player: p.player, x: p.x, y: p.y, lost: cam && age > c.lostAfterMs });
  }
  return out;
}

// ===== tracker.js =====
// MediaPipe body / hand tracking. Loads the pinned library from the CDN and runs one detection per video frame.


let VISION = null, FILESET = null;

async function loadTracker(kind) {
  const T = CONFIG.tracker;
  if (!VISION) {
    VISION = await import(/* @vite-ignore */ T.base + '/vision_bundle.mjs');
    FILESET = await VISION.FilesetResolver.forVisionTasks(T.base + '/wasm');
  }
  const make = delegate => kind === 'hand'
    ? VISION.HandLandmarker.createFromOptions(FILESET, {
        baseOptions: { modelAssetPath: T.models.hand, delegate }, runningMode: 'VIDEO', numHands: T.numHands,
        minHandDetectionConfidence: .3, minHandPresenceConfidence: .3, minTrackingConfidence: .3 })
    : VISION.PoseLandmarker.createFromOptions(FILESET, {
        baseOptions: { modelAssetPath: T.models.pose, delegate }, runningMode: 'VIDEO', numPoses: T.numPoses,
        minPoseDetectionConfidence: .4, minPosePresenceConfidence: .4, minTrackingConfidence: .4 });
  let lm;
  try { lm = await make('GPU'); } catch { lm = await make('CPU'); }
  const canvas = document.createElement('canvas');
  return { kind: kind === 'hand' ? 'hand' : 'pose', lm, canvas, c2d: canvas.getContext('2d'), lastTs: 0 };
}

function closeTracker(tr) { try { tr && tr.lm && tr.lm.close(); } catch { /* already closed */ } }

// Returns { kind, landmarks, vw, vh } or null.
function detectFrame(tr, video, { mode, zoom }) {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh || video.readyState < 2) return null;
  const cv = tr.canvas, ts = Math.max(performance.now(), tr.lastTs + 1);
  tr.lastTs = ts;
  if (tr.kind === 'pose') {
    // the body model needs to see the whole body: give it the full frame
    const dw = CONFIG.tracker.detectWidth[mode] || 640, dh = Math.round(dw * vh / vw);
    if (cv.width !== dw || cv.height !== dh) { cv.width = dw; cv.height = dh; }
    tr.c2d.drawImage(video, 0, 0, dw, dh);
  } else {
    // hand model: only the zoomed part that is shown, so hands are bigger
    const s = Math.max(W / vw, H / vh) * zoom, cw = W / s, ch = H / s;
    if (cv.width !== 960 || cv.height !== 540) { cv.width = 960; cv.height = 540; }
    tr.c2d.drawImage(video, (vw - cw) / 2, (vh - ch) / 2, cw, ch, 0, 0, 960, 540);
  }
  const res = tr.lm.detectForVideo(cv, ts);
  return { kind: tr.kind, landmarks: res.landmarks || [], vw, vh };
}

// ===== camera.js =====
// Video sources: the webcam, or a recorded clip played back through the same pipeline (SPEC §10.2).

function hiddenVideo() {
  const v = document.createElement('video');
  v.setAttribute('playsinline', ''); v.muted = true;
  v.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none';
  document.body.appendChild(v);
  return v;
}

/* ---------- choosing a camera (pure, unit tested) ---------- */
// Prefer a real external webcam over the laptop's built-in camera; avoid virtual cameras (OBS etc.).
const WEBCAM_BRAND = /\b(logitech|logi|brio|streamcam|c9\d\d|c270|c310|razer|kiyo|elgato|facecam|lifecam|anker|powerconf|insta360|obsbot|avermedia|emeet|nexigo|aukey|ugreen|jabra|panacast|poly|creative|usb)\b/i;
const BUILTIN_CAM = /\b(built[- ]?in|integrated|internal|facetime|isight|macbook|imac|truevision|easycamera|front camera|user facing)\b/i;
const VIRTUAL_CAM = /\b(virtual|obs|snap camera|mmhmm|xsplit|manycam|nvidia broadcast|camo|droidcam|epoccam|ndi)\b/i;
const PHONE_CAM = /\b(iphone|continuity|android|phone)\b/i;
const CAM_RANK = { webcam: 0, external: 1, phone: 2, builtin: 3, virtual: 4 };

function cameraKind(label = '') {
  if (VIRTUAL_CAM.test(label)) return 'virtual';
  if (BUILTIN_CAM.test(label)) return 'builtin';
  if (PHONE_CAM.test(label)) return 'phone';
  if (WEBCAM_BRAND.test(label)) return 'webcam';
  return 'external';   // unknown name: probably a plugged-in camera
}
// devices: [{ deviceId, label, kind: 'videoinput' }]; preferredId: a deviceId chosen in Settings, or 'auto'
function pickCamera(devices, preferredId = 'auto') {
  const cams = (devices || []).filter(d => d.kind === 'videoinput');
  if (!cams.length) return null;
  if (preferredId && preferredId !== 'auto') { const chosen = cams.find(d => d.deviceId === preferredId); if (chosen) return chosen; }
  return cams.map((d, i) => ({ d, i, r: CAM_RANK[cameraKind(d.label)] })).sort((a, b) => a.r - b.r || a.i - b.i)[0].d;
}
async function listCameras() {
  try { return (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput').map(d => ({ deviceId: d.deviceId, label: d.label, kind: 'videoinput' })); }
  catch { return []; }
}

// Opens a camera (a specific one if deviceId is given) and reports which one it really is.
async function openWebcam(deviceId = null) {
  const constraints = { width: { ideal: 1280 }, height: { ideal: 720 } };
  if (deviceId) constraints.deviceId = { exact: deviceId }; else constraints.facingMode = 'user';
  const stream = await navigator.mediaDevices.getUserMedia({ video: constraints, audio: false });
  const track = stream.getVideoTracks()[0], st = track && track.getSettings ? track.getSettings() : {};
  const video = hiddenVideo();
  video.srcObject = stream;
  await video.play();
  return { kind: 'webcam', video, stream, deviceId: st.deviceId || deviceId || '', label: (track && track.label) || '' };
}

async function openClip(file) {
  const video = hiddenVideo();
  video.src = URL.createObjectURL(file);
  video.loop = true;
  await video.play();
  return { kind: 'clip', video, stream: null, name: file.name };
}

function closeSource(src) {
  if (!src) return;
  if (src.stream) src.stream.getTracks().forEach(t => t.stop());
  if (src.kind === 'clip') URL.revokeObjectURL(src.video.src);
  src.video.remove();
}

function downloadBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

// Records `seconds` of the webcam stream and saves it as a .webm file on this computer.
function recordClip(stream, seconds, onTick, onDone) {
  const type = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  if (!type) { onDone(new Error('Recording is not supported in this browser')); return null; }
  const rec = new MediaRecorder(stream, { mimeType: type }), chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
    downloadBlob(new Blob(chunks, { type: 'video/webm' }), `bdou-clip-${stamp}.webm`);
    onDone(null);
  };
  rec.start(500);
  let left = seconds;
  onTick(left);
  const timer = setInterval(() => { left--; onTick(left); if (left <= 0) { clearInterval(timer); rec.stop(); } }, 1000);
  return { stop() { clearInterval(timer); if (rec.state !== 'inactive') rec.stop(); } };
}

const INTRO_CUES = {

  const pick = n => { const keys = ROSTER.map(c => c.key), out = []; while (out.length < n) { const k = keys[Math.floor(random() * keys.length)]; if (!out.includes(k)) out.push(k); } return out; };

  const seam = [];
  for (let i = 0; i <= 8; i++) { const k = i / 8; seam.push([W * (.56 - .12 * k) + (i && i < 8 ? (random() - .5) * 70 : 0), -10 + (H + 20) * k]); }

    }
    c.restore();
    if (t < .2) { c.fillStyle = `rgba(255,255,255,${1 - t / .2})`; c.fillRect(0, 0, W, H); }
    return;
  }

  if (t < 1.2) {
    // CUT B: impact frame. Colours flip: black silhouettes on white with manga speed lines.
    c.fillStyle = '#fff'; c.fillRect(0, 0, W, H);
    speedLines(c, W / 2, H / 2, 90, 150, '#000', 9, Math.floor(t * 30));
    drawChar(c, p1.key, W * .3, H * .52, 420, { silhouette: true });
    drawChar(c, p2.key, W * .7, H * .52, 420, { silhouette: true, flip: true });
    comic(c, 'ドン!', W * .5, H * .16, 120, '#fff', -.12);
    return;
  }

  // CUTS C–E: the face-off, with a slow camera push-in
  const push = 1 + .07 * easeInOut(span(t, 1.2, 4.6));
  c.save(); c.translate(W / 2, H / 2); c.scale(push, push); c.translate(-W / 2, -H / 2);
  [[p1, 0], [p2, 1]].forEach(([ch, i]) => {
    const col = cols[i], left = i === 0;
    c.save(); c.beginPath();
    if (left) { c.moveTo(-40, -40); c.lineTo(W * .58, -40); c.lineTo(W * .42, H + 40); c.lineTo(-40, H + 40); }
    else { c.moveTo(W + 40, -40); c.lineTo(W * .58, -40); c.lineTo(W * .42, H + 40); c.lineTo(W + 40, H + 40); }
    c.closePath(); c.clip();
    const g = c.createRadialGradient(left ? W * .25 : W * .75, H * .45, 40, left ? W * .25 : W * .75, H * .45, W * .6);

    // rotating light burst behind each fighter

    for (let k = 0; k < 14; k++) { c.rotate(Math.PI / 7); c.fillStyle = 'rgba(255,255,255,.09)'; c.beginPath(); c.moveTo(0, 0); c.lineTo(1000, -60); c.lineTo(1000, 60); c.fill(); }
    c.restore();
    screentone(c, left ? -40 : W * .55, -40, W * .5, H + 80, 'rgba(20,8,40,.35)', left);
    // the fighter slides in with motion trails, then holds a battle pose inside a flame aura
    const enter = easeBack(span(t, 1.25 + i * .08, 1.6 + i * .08)), fx = (left ? W * .25 : W * .75) + (left ? -1 : 1) * (1 - enter) * 640;
    const fy = H * .46 + Math.sin(t * 5 + i) * 6, size = 380;
    if (enter > .02) flameAura(c, fx, fy, size, col, t, i * 3);
    if (enter < .98) for (let k = 3; k >= 1; k--) drawChar(c, ch.key, fx + (left ? -1 : 1) * k * 70 * (1 - enter), fy, size, { flip: !left, alpha: .18 * (4 - k) });
    drawChar(c, ch.key, fx, fy, size, { flip: !left });
    c.restore();
  });
  // lightning seam
  c.save(); c.lineJoin = 'round';
  for (const [w, col] of [[22, 'rgba(255,225,77,.35)'], [9, '#fffbe0'], [3, '#fff']]) {
    c.strokeStyle = col; c.lineWidth = w; c.beginPath();
    for (let i = 0; i <= 10; i++) { const k = i / 10; c.lineTo(W * (.58 - .16 * k) + (i && i < 10 ? (Math.random() - .5) * 26 : 0), -40 + (H + 80) * k); }
    c.stroke();
  }
  c.restore();
  sakura(c, it, t);
  c.restore();

  // name plates (Japanese name + roman name), brush-stroke style
  const np = easeBack(span(t, 1.7, 2.0));
  if (np > 0) {
    brushPlate(c, 34 - (1 - np) * 700, 590, 500, cols[0], `${tr('p')}1 · ${p1.name}`, ANIME_LOOK[p1.key].jp, false);
    brushPlate(c, W - 534 + (1 - np) * 700, 590, 500, cols[1], `${tr('p')}2 · ${p2.name}`, ANIME_LOOK[p2.key].jp, true);

  // CUT D: VS slam over a giant 対 ("versus")

    c.fillStyle = '#fff'; c.fillText('対', W / 2, H * .43); c.restore();                    // faint "versus" kanji behind the VS
    comic(c, 'VS', W / 2, H * .42, 220 * (2.3 - 1.3 * easeBack(k)), '#ffe14d', -.1, Math.min(1, k * 3));
    if (t < 3.9) comic(c, 'ドン!', W * .2, H * .14, 90 * easeBack(span(t, 3.25, 3.4)), '#ff5fb0', -.2);
    if (t > 3.2 && t < 3.32) { c.fillStyle = 'rgba(255,255,255,.7)'; c.fillRect(0, 0, W, H); }
  }
  // CUT E: menacing ゴゴゴ rising up the sides, then GET READY / LET'S SORT

  if (t >= 4.6) { const k = span(t, 4.6, 4.8); comic(c, tr('introSort'), W / 2, H * .66, 90 * (2 - easeBack(k)), '#7dff9b', -.03, Math.min(1, k * 3)); }
